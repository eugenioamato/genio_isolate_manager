name: genio_isolate_manager
description: Create long-lived isolates for single or multiple functions, with support for Web Workers (via an efficient generator) and WASM compilation. Forked from isolate_manager with Flutter 3.44.8 compatibility.
version: 1.0.0
homepage: https://github.com/eugenioamato/genio_isolate_manager
repository: https://github.com/eugenioamato/genio_isolate_manager

topics:
  - isolate
  - worker
  - concurrent
  - wasm
  - web-workers

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  path: ^1.0.0
  stream_channel: ^2.0.0
  web: ^1.0.0

dev_dependencies:
  coverage: ^1.10.0
  test: ^1.25.8
  very_good_analysis: ^10.2.0
